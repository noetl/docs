name: "Regenerate DSL reference"

# The generated DSL reference (docs/reference/dsl/generated/) is a projection of
# noetl/server's orchestrate-core/schema/ artifacts (ai-meta RFC
# dsl-knowledge-base, Phase 4). This job regenerates it and opens a PR when the
# grammar changed. Merging that PR deploys through deploy-cloudflare-pages.yml.
#
# Triggers: nightly, manual, and a `server-release` repository_dispatch that
# the server release workflow can send.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "noetl/server ref to generate from"
        default: "main"
        type: string
  repository_dispatch:
    types: [server-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate
        env:
          REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
        run: node scripts/generate-dsl-reference.mjs --ref "$REF" | tee /tmp/gen.txt
      - name: Open a PR if the grammar changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/reference/dsl/generated; then
            echo "no change"; exit 0
          fi
          branch="docs/dsl-reference-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reference/dsl/generated
          git commit -m "docs(dsl): regenerate the DSL reference ($(cat /tmp/gen.txt))"
          git push origin "$branch"
          gh pr create --title "docs(dsl): regenerate the DSL reference" \
            --body "Automated: \`$(cat /tmp/gen.txt)\`. Generated by scripts/generate-dsl-reference.mjs; do not edit by hand." \
            --head "$branch" --base main
